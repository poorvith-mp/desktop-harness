[project]
name = "desktop-harness"
version = "0.4.3"
description = "Agent hands for your Mac — AX-first desktop control CLI for Grok Build and coding agents"
requires-python = ">=3.10"
dependencies = [
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-ApplicationServices>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
desktop-harness = "desktop_harness.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_harness"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "desktop_harness/data/SKILL.md"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
